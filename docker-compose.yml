services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    ports:
      - "8642:8642"
    volumes:
      - ./data:/opt/data
    environment:
      - CUSTOM_LLM_API_BASE=https://api.hunyuan.cloud.tencent.com/v1
      - CUSTOM_LLM_MODEL_NAME=hunyuan-turbo
      - CUSTOM_LLM_PROVIDER=custom
      - CUSTOM_LLM_API_KEY=your-api-key-here       # ← 替换成你真实的 Key
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  dashboard:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-dashboard
    restart: unless-stopped
    command: dashboard --host 0.0.0.0 --insecure
    ports:
      - "9119:9119"
    volumes:
      - ./data:/opt/data
    environment:
      - GATEWAY_HEALTH_URL=http://hermes:8642
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"